services:
  # Serviço Nginx
  nginx:
    image: nginx:alpine
    container_name: alphacode_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - alphacode_network

  # Serviço PHP
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alphacode_php
    volumes:
      - ./:/var/www/html
    networks:
      - alphacode_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  alphacode_network:
    driver: bridge
